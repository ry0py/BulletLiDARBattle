<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁石の注意</title>
<link rel="stylesheet" href="poster.css">
<style>
  /* 紙のふちを黄と黒のしましまにして「注意」とひと目でわかるようにする */
  .page { padding: 0; background: repeating-linear-gradient(-45deg, var(--yellow) 0 9mm, var(--ink) 9mm 18mm); }
  .inner { margin: 9mm; min-height: 0; background: #fff; border-radius: 3mm; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 9mm 12mm 7mm; text-align: center; }

  .tag { background: var(--ink); color: var(--yellow); font-weight: 900; font-size: 7mm; letter-spacing: .5em; padding: 1.2mm 4mm 1.2mm 6mm; border-radius: 2mm; }
  .sign { width: 92mm; margin: 5mm 0 4mm; }
  h1 { margin: 0; font-size: 19mm; font-weight: 900; letter-spacing: .04em; line-height: 1.15; }
  h1 em { font-style: normal; color: var(--hard); }
  .lead { margin: 4mm 0 0; font-size: 6mm; font-weight: 700; line-height: 1.5; }

  ul.items { list-style: none; margin: auto 0 4mm; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 4mm; text-align: left; }
  ul.items li { display: flex; align-items: center; gap: 5mm; border: .7mm solid var(--ink); border-radius: 3mm; padding: 3mm 5mm; }
  ul.items svg { width: 20mm; height: 20mm; flex: none; }
  ul.items b { display: block; font-size: 6.2mm; font-weight: 900; line-height: 1.3; }
  ul.items span { display: block; font-size: 4mm; font-weight: 700; color: #495057; margin-top: .8mm; }

  /* 印刷で 2 枚目（白紙）が出ないよう、紙 1 枚の大きさで切る */
  @media print {
    html, body { width: 210mm; height: 297mm; overflow: hidden; }
    .page { margin: 0; break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="inner">
    <div class="tag">注意</div>

    <!-- 三角の注意マークに U 字の磁石 -->
    <svg class="sign" viewBox="0 0 100 88" aria-label="磁石の注意マーク">
      <path d="M50 5 L95 83 H5 Z" fill="#ffd43b" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
      <g transform="translate(12.5 22) scale(.75)">
      <path d="M32 38 V57 A18 18 0 0 0 68 57 V38 H58 V57 A8 8 0 0 1 42 57 V38 Z" fill="#e03131" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="32" y="38" width="10" height="7" fill="#dee2e6" stroke="#111" stroke-width="1.6"/>
      <rect x="58" y="38" width="10" height="7" fill="#dee2e6" stroke="#111" stroke-width="1.6"/>
      <!-- 引きつける線 -->
      <g fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round">
        <path d="M34 32 L32 26"/><path d="M37 31 V24"/><path d="M40 32 L42 26"/>
        <path d="M60 32 L58 26"/><path d="M63 31 V24"/><path d="M66 32 L68 26"/>
      </g>
      </g>
    </svg>

    <h1><em>強い磁石</em>を<br>使っています</h1>
    <p class="lead">この展示は、板の下の磁石で駒を動かしています。</p>

    <ul class="items">
      <li>
        <svg viewBox="0 0 40 40" aria-label="ペースメーカー">
          <circle cx="20" cy="20" r="19" fill="#fff5f5" stroke="#111" stroke-width="1.2"/>
          <path d="M20 32 C 7 24, 5 16, 10.5 11 C 15 7.5, 19 9.5, 20 12.5 C 21 9.5, 25 7.5, 29.5 11 C 35 16, 33 24, 20 32 Z" fill="#e03131"/>
          <polyline points="8,19 14,19 16.5,14 20.5,25 23.5,16.5 25.5,19 32,19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div><b>ペースメーカーなどの医療機器を<br>お使いの方は、近づかないでください</b></div>
      </li>
      <li>
        <svg viewBox="0 0 40 40" aria-label="カードやスマホを近づけない">
          <circle cx="20" cy="20" r="19" fill="#f8f9fa" stroke="#111" stroke-width="1.2"/>
          <rect x="7" y="12" width="19" height="13" rx="1.5" fill="#74c0fc" stroke="#111" stroke-width="1"/>
          <rect x="7" y="15" width="19" height="2.6" fill="#111"/>
          <rect x="21" y="10" width="11" height="19" rx="2" fill="#343a40" stroke="#111" stroke-width="1"/>
          <rect x="22.5" y="12" width="8" height="14" fill="#dee2e6"/>
          <circle cx="20" cy="20" r="14" fill="none" stroke="#e03131" stroke-width="3"/>
          <line x1="10.1" y1="10.1" x2="29.9" y2="29.9" stroke="#e03131" stroke-width="3"/>
        </svg>
        <div><b>スマホ・IC カード・時計を<br>近づけないでください</b><span>こわれたり、データが消えたりすることがあります</span></div>
      </li>
      <li>
        <svg viewBox="0 0 40 40" aria-label="磁石に指をはさまない">
          <circle cx="20" cy="20" r="19" fill="#f8f9fa" stroke="#111" stroke-width="1.2"/>
          <rect x="16" y="9" width="8" height="18" rx="4" fill="#ffd8a8" stroke="#111" stroke-width="1"/>
          <rect x="5.5" y="17" width="9" height="9" fill="#e03131" stroke="#111" stroke-width="1"/>
          <rect x="25.5" y="17" width="9" height="9" fill="#1c7ed6" stroke="#111" stroke-width="1"/>
          <text x="10" y="24" font-size="6" font-weight="900" fill="#fff" text-anchor="middle">N</text>
          <text x="30" y="24" font-size="6" font-weight="900" fill="#fff" text-anchor="middle">S</text>
          <path d="M8 31 H 14 M32 31 H 26" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 29 L14.5 31 L12 33 M28 29 L25.5 31 L28 33" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div><b>磁石どうしに指を<br>はさまないよう気をつけてね</b></div>
      </li>
    </ul>

  </div>
</div>
</body>
</html>
