<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>被弾ランキング</title>
<style>
  /* 会場はネットが無い前提なので、外部フォント・CDN は使わない */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8a8a;
    --line: #fff;
    --new: #ffe14d;
    --easy: #5be37d;
    --medium: #ffb43b;
    --hard: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "BIZ UDGothic", "MS Gothic", "Yu Gothic UI", monospace;
    display: flex;
    flex-direction: column;
    padding: 2.5vh 3vw;
    gap: 2.5vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  /* 見出しの字（Zen Old Mincho Black, OFL）。オフラインで使うため「被弾ランキング」の字だけ抜き出して fonts/ に置いている */
  @font-face {
    font-family: "Zen Old Mincho";
    font-weight: 900;
    src: url("fonts/ZenOldMincho-title.woff2") format("woff2");
  }
  h1 {
    margin: 0;
    font-family: "Zen Old Mincho", "BIZ UDGothic", "MS Gothic", "Yu Gothic UI", monospace;
    font-weight: 900;
    text-shadow: 0 0 .25em rgba(255, 255, 255, .55), 0 0 .05em #fff; /* 白いまま光らせて豪華に */
    font-size: 5vh;
    letter-spacing: .15em;
  }
  #total { font-size: 2.6vh; color: var(--dim); }
  h1 .debug { text-shadow: none; margin-left: .6em; padding: 0 .4em; font-size: 2.6vh; letter-spacing: .1em; color: #000; background: var(--new); vertical-align: middle; }
  #total b { color: var(--fg); font-size: 3.4vh; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr) 0.9fr;
    gap: 2vw;
    min-height: 0;
  }
  .board {
    border: 4px solid var(--line);
    padding: 1.5vh 1.5vw;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .board h2 {
    margin: 0 0 1vh;
    font-size: 4vh;
    text-align: center;
    letter-spacing: .1em;
    color: var(--c);
  }
  .board h2 small { display: block; font-size: 2vh; color: var(--dim); letter-spacing: 0; margin-top: .5vh; }
  ol { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: .3vh; }
  li {
    flex: 1;
    display: grid;
    grid-template-columns: 5.6em 1fr 2.6em; /* 1 列目は「15回以上」のバッジが入る幅 */
    align-items: center;
    gap: .6vw;
    font-size: 2.4vh;
    padding: 0 .6vw;
    border-bottom: 1px dashed #333;
  }
  /* 被弾回数はバッジにする。4 回以上は同じ灰色で動かさない */
  li .hits {
    justify-self: start;
    padding: .1em .55em;
    border-radius: 1em;
    background: #444;
    color: #ddd;
    font-weight: bold;
    white-space: nowrap;
  }
  li .bar { height: 1.3vh; background: var(--c); min-width: 2px; }
  li .count { text-align: right; font-weight: bold; }
  li .count small { font-size: 1.6vh; font-weight: normal; color: var(--dim); margin-left: .2em; }
  li.zero .bar { background: #333; }
  li.zero .count { color: #444; }

  /* 被弾 0〜3 回は特別な色。0 回は虹色が流れ、1〜3 回は金・銀・銅が光って脈打つ。 */
  li.h0 .hits, li.h1 .hits, li.h2 .hits, li.h3 .hits { color: #111; }
  li.h0 .hits, li.h0 .bar {
    /* 虹を 2 周ぶん描き、半分（1 周ぶん）ずらすと継ぎ目なく流れる */
    background: linear-gradient(90deg, #ff4d4d, #ffb43b, #ffe14d, #5be37d, #4dc3ff, #9b6bff,
                                       #ff4d4d, #ffb43b, #ffe14d, #5be37d, #4dc3ff, #9b6bff, #ff4d4d) 0 0 / 200% 100%;
    animation: rainbow 2.5s linear infinite;
  }
  li.h1 .hits, li.h1 .bar {
    background: linear-gradient(110deg, #a8720a 0%, #ffd34d 35%, #fff7c8 50%, #ffd34d 65%, #a8720a 100%) 0 0 / 300% 100%;
    animation: shine 2.2s ease-in-out infinite alternate;
  }
  li.h1 .hits { box-shadow: 0 0 .6em #ffd34d88; animation: shine 2.2s ease-in-out infinite alternate, pulse 1.1s ease-in-out infinite alternate; }
  li.h2 .hits, li.h2 .bar {
    background: linear-gradient(110deg, #7c7c7c 0%, #d6d6d6 35%, #ffffff 50%, #d6d6d6 65%, #7c7c7c 100%) 0 0 / 300% 100%;
    animation: shine 2.6s ease-in-out infinite alternate;
  }
  li.h3 .hits, li.h3 .bar {
    background: linear-gradient(110deg, #6e3612 0%, #c98450 35%, #f4c79c 50%, #c98450 65%, #6e3612 100%) 0 0 / 300% 100%;
    animation: shine 3s ease-in-out infinite alternate;
  }
  /* 金 → 銀 → 銅の順に脈打ちを小さく・ゆっくりにして、順位の差を残す */
  li.h2 .hits { box-shadow: 0 0 .5em #ffffff55; animation: shine 2.6s ease-in-out infinite alternate, pulse-small 1.3s ease-in-out infinite alternate; }
  li.h3 .hits { box-shadow: 0 0 .5em #e3a06a55; animation: shine 3s ease-in-out infinite alternate, pulse-small 1.5s ease-in-out infinite alternate; }
  @keyframes rainbow { to { background-position: 100% 0; } }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes pulse { to { transform: scale(1.08); } }
  @keyframes pulse-small { to { transform: scale(1.04); } }
  li.latest { background: #2a2600; outline: 2px solid var(--new); animation: blink 1s steps(2) 6; }
  @keyframes blink { 50% { background: transparent; } }

  .cards {
    border: 4px solid var(--new);
    padding: 2vh 1vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vh;
    min-height: 0;
  }
  .cards h2 { margin: 0; font-size: 3.4vh; color: var(--new); text-align: center; }
  .cards h2 small { display: block; font-size: 1.9vh; color: var(--dim); margin-top: .5vh; }
  /* 上半分に直前のプレイの QR、下半分にそのプレイの再生 */
  .card, .replay { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: .8vh; }
  .card img { flex: 1; min-height: 0; max-width: 100%; aspect-ratio: 1; image-rendering: pixelated; }
  .card img:not([src]) { visibility: hidden; }
  .card img[src] { outline: .5vh solid var(--new); }
  .card p { margin: 0; font-size: 2.2vh; white-space: nowrap; display: flex; align-items: center; gap: .5em; }
  .card p .label { color: var(--new); }
  .replay h3 { margin: 0; font-size: 2.2vh; color: var(--dim); font-weight: normal; }
  .replay canvas { flex: 1; min-height: 0; width: 100%; }

  /* プレイ中は被弾ランキングの代わりに LiDAR の視界（live.json）を出す */
  .live { display: none; grid-column: span 3; border: 4px solid var(--line); padding: 1.5vh 1.5vw; flex-direction: column; gap: 1vh; min-height: 0; }
  .live-info { font-size: 3.4vh; display: flex; align-items: baseline; gap: .8em; }
  .live-info .difficulty { font-size: 4.4vh; font-weight: bold; letter-spacing: .1em; }
  .live-info b { font-size: 4.4vh; }
  .live canvas { flex: 1; min-height: 0; width: 100%; }
  .live .legend { margin: 0; font-size: 2vh; color: var(--dim); }
  .live .legend span { margin-right: 2em; }
  .live-title { display: none; }
  body.playing .board, body.playing .rank-title { display: none; }
  body.playing .live { display: flex; }
  body.playing .live-title { display: inline; }

  #status { margin-left: auto; margin-right: 2em; font-size: 1.8vh; color: var(--hard); }
</style>
</head>
<body>
<header>
  <h1><span class="rank-title">被弾ランキング</span><span class="live-title">LiDAR の視界</span></h1>
  <span id="status"></span>
  <div id="total">これまでの挑戦 <b>0</b> 回</div>
</header>

<main>
  <section class="board" data-difficulty="Easy" style="--c: var(--easy)"><h2>EASY<small>被弾回数ごとの人数</small></h2><ol></ol></section>
  <section class="board" data-difficulty="Medium" style="--c: var(--medium)"><h2>MEDIUM<small>被弾回数ごとの人数</small></h2><ol></ol></section>
  <section class="board" data-difficulty="Hard" style="--c: var(--hard)"><h2>HARD<small>被弾回数ごとの人数</small></h2><ol></ol></section>
  <section class="live">
    <div class="live-info"></div>
    <canvas></canvas>
    <p class="legend"><span style="color: #4dc3ff">● LiDAR が見ている点</span><span style="color: var(--new)">◯ 見つけたハート</span><span style="color: var(--fg)">● SOUL</span><span style="color: #ff5aa0">■ LiDAR</span></p>
  </section>
  <section class="cards">
    <h2>記録カード<small>スマホで読み取って保存</small></h2>
    <div class="card"><img alt=""><p></p></div>
    <div class="replay"><h3>さっきのプレイ</h3><canvas></canvas></div>
  </section>
</main>

<script src="qrcode.js"></script>
<script src="card/cardcode.js"></script>
<script src="cardqr.js"></script>
<script src="card/replay.js"></script>
<script>
  const MAX_HITS = 15;     // この回数以上はまとめて「○回以上」の 1 行にする
  const POLL_MS = 3000;    // plays.jsonl を読み直す間隔
  // 本番は localhost:8000/ のまま。?debug を付けるとデバッグモードのプレイだけを出す（本番のプレイは出さない）。
  const DEBUG_VIEW = new URLSearchParams(location.search).has("debug");
  if (DEBUG_VIEW) {
    document.querySelector("h1").insertAdjacentHTML("beforeend", '<span class="debug">DEBUG</span>');
    document.title += "（デバッグ）";
  }

  let lastText = null;

  // 1 行 1 プレイ。書き込み途中の行などは読み飛ばし、今の表示（本番／デバッグ）のプレイだけを返す。
  function parse(text) {
    const plays = [];
    for (const line of text.split("\n")) {
      if (!line.trim()) continue;
      try {
        const p = JSON.parse(line);
        if (typeof p.hits === "number" && p.difficulty && !!p.debug === DEBUG_VIEW) plays.push(p);
      } catch { /* 壊れた行は無視 */ }
    }
    return plays;
  }

  // 被弾回数ごとの人数。添字 = 被弾回数（MAX_HITS 以上は最後の 1 つにまとめる）。
  function bucket(hits) { return Math.min(hits, MAX_HITS); }

  function histogram(plays) {
    const counts = new Array(MAX_HITS + 1).fill(0);
    for (const p of plays) counts[bucket(p.hits)]++;
    return counts;
  }

  function clock(time) { return time.slice(11, 16); }

  function render(plays) {
    const latest = plays[plays.length - 1];
    document.querySelector("#total b").textContent = plays.length;

    for (const board of document.querySelectorAll(".board")) {
      const difficulty = board.dataset.difficulty;
      const counts = histogram(plays.filter(p => p.difficulty === difficulty));
      const max = Math.max(1, ...counts);
      const ol = board.querySelector("ol");
      ol.replaceChildren();
      counts.forEach((n, hits) => {
        const li = document.createElement("li");
        if (n === 0) li.classList.add("zero");
        if (hits <= 3) li.classList.add(`h${hits}`); // 0〜3 回はバッジの色（CSS）
        if (latest && latest.difficulty === difficulty && bucket(latest.hits) === hits) li.classList.add("latest");
        li.innerHTML = `<span class="hits">${hits === MAX_HITS ? `${hits}回以上` : `${hits}回`}</span>`
                     + `<span class="bar" style="width: ${n / max * 100}%"></span>`
                     + `<span class="count">${n}<small>人</small></span>`;
        ol.appendChild(li);
      });
    }

    renderCards(plays);
  }

  // 直前のプレイの記録カードの QR（作り方は cardqr.js）と、そのプレイの再生。
  // 同じプレイなら作り直さない（失敗したときだけ次の読み直しでやり直す）。
  let cardKey = null;

  async function renderCards(plays) {
    const p = plays.filter(p => p.id).at(-1);
    const card = document.querySelector(".card");
    const img = card.querySelector("img");
    const key = p ? `${p.id} ${p.difficulty} ${p.hits}` : ""; // 管理画面で直したら作り直す
    if (key === cardKey) return;
    cardKey = key;
    card.querySelector("p").innerHTML = p
      ? `<span class="label">さっき</span>${clock(p.time)} ${p.difficulty} 被弾${p.hits}回`
      : "";
    img.removeAttribute("src");
    player.show(null);
    if (!p) return;
    try {
      const [src, data] = await Promise.all([cardQrDataUrl(p.id), fetchReplay(p.id)]);
      if (cardKey !== key) return;
      img.src = src;
      player.show(toReplay(data));
    } catch {
      if (cardKey === key) cardKey = null;
    }
  }

  // canvas の描画サイズを表示サイズに合わせ、[2D コンテキスト, 幅, 高さ, 1 CSS px の実ピクセル数] を返す。
  function fitCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    return [canvas.getContext("2d"), w, h, dpr];
  }

  const textFont = (vh, dpr) => `${vh * innerHeight / 100 * dpr}px "BIZ UDGothic", "MS Gothic", monospace`;

  // ---- さっきのプレイの再生（下半分。ずっと繰り返す。描き方は card/replay.js） ----
  const player = ReplayPlayer.create(document.querySelector(".replay canvas"), { fontPx: () => innerHeight * 0.021 });

  // replays/<id>.json → 盤面の正規化座標（0〜1、y は上向き）にした軌跡と被弾
  function toReplay(r) {
    const [bx, by, bw, bh] = r.board;
    const norm = ([x, y]) => [(x - bx) / bw, (y - by) / bh];
    const hits = r.hitEvents.slice(0, r.hits ?? r.hitEvents.length).map(h => {
      const [x, y] = norm([h.x, h.y]);
      return { t: h.t, x, y };
    });
    return { aspect: bw / bh, interval: r.pathInterval, path: r.path.map(norm), hits };
  }

  // ---- プレイ中の LiDAR の視界（Unity の Flow/LiveFeed が書く live.json。座標は盤面の正規化座標 × 1000） ----
  const LIVE_POLL_MS = 100;
  const VIEW_MARGIN = 0.3; // Unity が点を送ってくる範囲（盤面の外側にこれだけ）
  const COLORS = { Easy: "var(--easy)", Medium: "var(--medium)", Hard: "var(--hard)" };
  let playing = false;

  function drawLive(d) {
    document.querySelector(".live-info").innerHTML =
      `<span class="difficulty" style="color: ${COLORS[d.difficulty]}">${d.difficulty.toUpperCase()}</span>`
      + `<span>プレイ中</span><span>残り <b>${d.remaining}</b> 秒</span>`;

    const [g, w, h, dpr] = fitCanvas(document.querySelector(".live canvas"));
    g.clearRect(0, 0, w, h);
    const aspect = d.aspect / 1000;
    const pt = ([x, y]) => [x / 1000, y / 1000];
    const sensor = d.sensor && pt(d.sensor);

    // 見せる範囲: 盤面の周りと LiDAR の位置。横は物理の長さの比（aspect）で伸ばす
    let u0 = -VIEW_MARGIN, u1 = 1 + VIEW_MARGIN, v0 = -VIEW_MARGIN, v1 = 1 + VIEW_MARGIN;
    if (sensor) {
      u0 = Math.min(u0, sensor[0] - 0.05); u1 = Math.max(u1, sensor[0] + 0.05);
      v0 = Math.min(v0, sensor[1] - 0.05); v1 = Math.max(v1, sensor[1] + 0.05);
    }
    const scale = Math.min(w / ((u1 - u0) * aspect), h / (v1 - v0));
    const ox = (w - (u1 - u0) * aspect * scale) / 2, oy = (h - (v1 - v0) * scale) / 2;
    const X = u => ox + (u - u0) * aspect * scale, Y = v => oy + (v1 - v) * scale;

    // 盤面（方眼と枠）
    g.strokeStyle = "#1c1c1c"; g.lineWidth = dpr;
    for (let i = 1; i < 8; i++) {
      g.beginPath(); g.moveTo(X(i / 8), Y(0)); g.lineTo(X(i / 8), Y(1)); g.stroke();
      g.beginPath(); g.moveTo(X(0), Y(i / 8)); g.lineTo(X(1), Y(i / 8)); g.stroke();
    }
    g.strokeStyle = "#fff"; g.lineWidth = 3 * dpr;
    g.strokeRect(X(0), Y(1), X(1) - X(0), Y(0) - Y(1));

    if (d.lidar) {
      const pts = d.points;
      // LiDAR から点へのレーザー（うすく）と点
      g.strokeStyle = "rgba(77, 195, 255, .08)"; g.lineWidth = dpr;
      g.beginPath();
      for (let i = 0; i < pts.length; i += 2) { g.moveTo(X(sensor[0]), Y(sensor[1])); g.lineTo(X(pts[i] / 1000), Y(pts[i + 1] / 1000)); }
      g.stroke();
      g.fillStyle = "#4dc3ff";
      const s = 4 * dpr;
      for (let i = 0; i < pts.length; i += 2) g.fillRect(X(pts[i] / 1000) - s / 2, Y(pts[i + 1] / 1000) - s / 2, s, s);

      g.fillStyle = "#ff5aa0";
      g.fillRect(X(sensor[0]) - 8 * dpr, Y(sensor[1]) - 8 * dpr, 16 * dpr, 16 * dpr);

      if (d.heart) {
        const [u, v] = pt(d.heart);
        g.strokeStyle = "#ffe14d"; g.lineWidth = 3 * dpr;
        g.beginPath(); g.arc(X(u), Y(v), 22 * dpr, 0, Math.PI * 2); g.stroke();
      }
    } else {
      g.fillStyle = "#8a8a8a"; g.font = textFont(3, dpr);
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("LiDAR につながっていません", X(0.5), Y(0.5));
    }

    const [su, sv] = pt(d.soul);
    g.fillStyle = "#fff";
    g.beginPath(); g.arc(X(su), Y(sv), 9 * dpr, 0, Math.PI * 2); g.fill();
  }

  async function pollLive() {
    try {
      const res = await fetch("live.json", { cache: "no-store" });
      if (res.ok) { // 503 は Unity が書き換え中なので今の表示のまま
        const d = await res.json();
        const now = d.state === "playing";
        if (now) drawLive(d);
        if (now !== playing) {
          playing = now;
          document.body.classList.toggle("playing", playing);
          if (!playing) poll(); // 終わったらすぐ結果を出す
        }
      }
    } catch { /* サーバーが止まっているときは poll() が知らせる */ }
    setTimeout(pollLive, LIVE_POLL_MS);
  }

  async function poll() {
    try {
      const res = await fetch("plays.jsonl", { cache: "no-store" });
      const text = await res.text();
      if (text !== lastText) {
        lastText = text;
        render(parse(text));
      }
      document.getElementById("status").textContent = "";
    } catch {
      document.getElementById("status").textContent = "サーバーにつながりません";
    }
  }

  poll();
  setInterval(poll, POLL_MS);
  pollLive();
</script>
</body>
</html>
