<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録カード</title>
<!-- 難易度（EASY など）と「被弾」だけに使う見出しの字。使う字だけ取り寄せて軽くする（text=） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=EASYMEDIUMHARD%E8%A2%AB%E5%BC%BE">
<style>
  :root { --bg: #000; --fg: #fff; --dim: #8a8a8a; --accent: #ffe14d; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 16px 40px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .1em; }
  #card { width: 100%; max-width: 540px; border: 2px solid #333; display: none; }
  button {
    width: 100%;
    max-width: 540px;
    padding: 16px;
    font: inherit;
    font-size: 18px;
    font-weight: bold;
    color: #000;
    background: var(--accent);
    border: 0;
    display: none;
  }
  p { margin: 0; color: var(--dim); font-size: 14px; text-align: center; }
  /* 見出しのすぐ下に寄せる（body の gap を詰める）。
     大きさはカードの難易度（MEDIUM など）の字に合わせる。カードは幅 1080 に 96px で描き、幅 540px までに縮めて出す。
     入りきらないときは「ありがとう！」の前で折り返す（keep-all と <wbr>） */
  p.thanks { margin-top: -10px; color: var(--fg); font-size: min(48px, calc((100vw - 32px) * 96 / 1080)); font-weight: bold; line-height: 1.3; word-break: keep-all; }
  /* プレイの再生（2 倍速で繰り返す。描き方は replay.js）。高さは盤面の縦横比で JS が決める */
  #replay { width: 100%; max-width: 540px; display: none; flex-direction: column; gap: 8px; }
  #replay h2 { margin: 0; font-size: 16px; color: var(--dim); font-weight: normal; text-align: center; }
  #replay canvas { width: 100%; }
  /* 保存（黄色）と並ぶので、こちらは枠だけにして目立ちすぎないようにする */
  a.link {
    width: 100%;
    max-width: 540px;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
</style>
</head>
<body>
<h1>あなたの記録</h1>
<p class="thanks">プレイしてくれて<wbr>ありがとう！</p>
<img id="card" alt="記録カード">
<button id="save">画像を保存</button>
<!-- 新しいタブで開き、記録カードのページは残す -->
<a class="link" href="https://x.com/Ttech_toon_/status/2108003929850253386?s=20" target="_blank" rel="noopener">おすすめの屋台</a>
<p id="message">読み込み中…</p>
<section id="replay"><h2>あなたのプレイ（2 倍速）</h2><canvas></canvas></section>

<script src="cardcode.js"></script>
<script src="replay.js"></script>
<script src="portraits/list.js"></script>
<script>
  const TITLE = "弾幕ゲーム in 工大祭2026";
  const CREDIT = "制作: りょうぴ ／ イラスト: 世界のたまちゃん・ヨーダ";
  const W = 1080, PAD = 60; // 高さは盤面の縦横比で決まる（draw）
  const COLORS = { Easy: "#5be37d", Medium: "#ffb43b", Hard: "#ff5a5a" };
  const FONT = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif';

  const pad2 = n => String(n).padStart(2, "0");
  // 年はタイトル（工大祭2026）にあるので出さない
  const dateText = d => `${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}  ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const font = (size, weight = "normal") => `${weight} ${size}px ${FONT}`;
  // 見出し用。読み込めなかったら FONT に落ちる。
  const HEADING_FONT = '"Dela Gothic One", ' + FONT;
  const headingFont = size => `${size}px ${HEADING_FONT}`;

  // 難易度のキャラの立ち絵を 1 枚ランダムに選んで読み込む（ゲームと同じ組み合わせ）。読めなければ null。
  async function loadPortrait(difficulty) {
    const names = PORTRAITS[difficulty];
    if (!names?.length) return null;
    const img = new Image();
    img.src = "portraits/" + names[Math.floor(Math.random() * names.length)];
    try { await img.decode(); return img; } catch { return null; }
  }

  // canvas はフォントの読み込みを待たずに描くので、先に読み込んでおく。回線が遅くても 3 秒で諦める。
  function loadHeadingFont() {
    const timeout = new Promise(resolve => setTimeout(resolve, 3000));
    return Promise.race([document.fonts.load(headingFont(96), "EASYMEDIUMHARD被弾"), timeout]).catch(() => {});
  }

  // 赤い ✕（被弾の印）。盤面と「被弾したタイミング」で共用する。
  function cross(g, x, y, r) {
    g.beginPath(); g.moveTo(x - r, y - r); g.lineTo(x + r, y + r); g.moveTo(x + r, y - r); g.lineTo(x - r, y + r); g.stroke();
  }

  // 被弾 0〜3 回は数字と「回」の文字そのものを虹・金・銀・銅に塗って光らせる。
  // 返すのは文字の塗りと光の色。x0〜x1 は文字の左右端。
  const rainbow = (g, x0, x1) => {
    const grad = g.createLinearGradient(x0, 0, x1, 0);
    for (let k = 0; k <= 6; k++) grad.addColorStop(k / 6, `hsl(${k * 60}, 100%, 62%)`);
    return { fill: grad, shadow: "hsl(60, 100%, 60%)" };
  };
  // 金・銀・銅: 文字の真ん中に明るい帯を入れて金属らしくする。
  const metal = (base, light, shadow) => (g, x0, x1) => {
    const cx = (x0 + x1) / 2;
    const grad = g.createLinearGradient(cx - 90, 0, cx + 90, 0);
    grad.addColorStop(0, base); grad.addColorStop(0.5, light); grad.addColorStop(1, base);
    return { fill: grad, shadow };
  };
  const GLOWS = [
    rainbow,
    metal("#e0a81e", "#fff6c8", "#ffc93c"),
    metal("#a9a9a9", "#ffffff", "#e6e6e6"),
    metal("#b8743c", "#ffd2a8", "#e08a4a"),
  ];

  function drawCount(g, hits, sy) {
    g.fillStyle = "#fff";
    g.font = headingFont(58);
    g.fillText("被弾", PAD, sy - 100);

    const count = String(hits);
    g.font = font(150, "bold");
    const cw = g.measureText(count).width;
    g.font = font(56);
    const ux = PAD + cw + 28;
    const x1 = ux + g.measureText("回").width;

    g.save();
    const glow = GLOWS[hits]?.(g, PAD, x1);
    if (glow) { g.fillStyle = glow.fill; g.shadowColor = glow.shadow; g.shadowBlur = 30; }
    g.font = font(150, "bold");
    g.fillText(count, PAD, sy + 50);
    g.font = font(56);
    g.fillText("回", ux, sy + 50);
    g.restore();
    return x1;
  }

  // その日の順位（右寄せ）。1〜3 位は数字と「位」を金・銀・銅に光らせる。
  function drawRank(g, rank, total, sy) {
    const x1 = W - PAD;
    g.fillStyle = "#8a8a8a";
    g.font = font(34);
    g.textAlign = "right";
    g.fillText(`今日の ${total}人中`, x1, sy - 100);
    g.textAlign = "left";

    const num = String(rank);
    g.font = font(56);
    const ux = x1 - g.measureText("位").width;
    g.font = font(120, "bold");
    const x0 = ux - 20 - g.measureText(num).width;

    g.save();
    g.fillStyle = "#fff";
    const glow = GLOWS[rank]?.(g, x0, x1);
    if (glow) { g.fillStyle = glow.fill; g.shadowColor = glow.shadow; g.shadowBlur = 30; }
    g.fillText(num, x0, sy + 50);
    g.font = font(56);
    g.fillText("位", ux, sy + 50);
    g.restore();
  }

  function draw(rec, portrait) {
    // 上から順に積む。盤面が縦長なほど下の段が下がるので、画像の高さもそれに合わせる。
    const bw = W - PAD * 2, bh = bw / rec.aspect, bx = PAD, by = 260;
    const sy = by + bh + 230;  // 被弾回数
    const ty = sy + 150;       // 被弾したタイミング
    const cy = ty + 110;       // クレジット
    const H = Math.round(cy + 40);

    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext("2d");

    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);

    // 見出し。左にキャラ、その右にタイトルと難易度。日時はタイトルの行の右端（難易度とぶつからないように）。
    let tx = PAD;
    if (portrait) {
      const box = 190, scale = Math.min(box / portrait.width, box / portrait.height);
      const w = portrait.width * scale, h = portrait.height * scale;
      g.drawImage(portrait, PAD + (box - w) / 2, 40 + (box - h), w, h); // 下ぞろえ
      tx = PAD + box + 24;
    }
    g.fillStyle = "#8a8a8a";
    g.font = font(34);
    g.fillText(TITLE, tx, 100);
    g.fillStyle = COLORS[rec.difficulty] ?? "#fff";
    g.font = headingFont(96);
    g.fillText(rec.difficulty.toUpperCase(), tx, 210);
    g.fillStyle = "#fff";
    g.font = font(34);
    g.textAlign = "right";
    g.fillText(dateText(rec.time), W - PAD, 100);
    g.textAlign = "left";

    // 盤面と軌跡（座標は 0〜1、y は上向き）
    const px = x => bx + x * bw, py = y => by + (1 - y) * bh;

    g.strokeStyle = "#1c1c1c";
    g.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      g.beginPath(); g.moveTo(bx + bw * i / 8, by); g.lineTo(bx + bw * i / 8, by + bh); g.stroke();
      g.beginPath(); g.moveTo(bx, by + bh * i / 8); g.lineTo(bx + bw, by + bh * i / 8); g.stroke();
    }

    g.lineWidth = 5;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.strokeStyle = "#4dc3ff";
    const n = rec.path.length;
    g.beginPath();
    rec.path.forEach(([x, y], i) => i === 0 ? g.moveTo(px(x), py(y)) : g.lineTo(px(x), py(y)));
    g.stroke();
    if (n > 0) {
      g.strokeStyle = "#fff"; g.lineWidth = 4;
      g.beginPath(); g.arc(px(rec.path[0][0]), py(rec.path[0][1]), 14, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(px(rec.path[n - 1][0]), py(rec.path[n - 1][1]), 12, 0, Math.PI * 2); g.fill();
    }

    g.save();
    g.strokeStyle = "#ff3b3b"; g.lineWidth = 5;
    g.shadowColor = "#ff3b3b"; g.shadowBlur = 16;
    for (const h of rec.hits) cross(g, px(h.x), py(h.y), 13);
    g.restore();

    g.strokeStyle = "#fff"; g.lineWidth = 6;
    g.strokeRect(bx, by, bw, bh);

    g.font = font(26);
    g.fillStyle = "#8a8a8a";
    g.fillText("○ スタート   ● ゴール   ✕ 被弾", bx, by + bh + 44);

    // 被弾回数（右にその日の順位。ノーミスはその間）
    const countRight = drawCount(g, rec.count, sy);
    if (rec.count === 0) {
      g.fillStyle = "#ffe14d";
      g.font = font(72, "bold");
      g.fillText("ノーミス！", countRight + 40, sy + 40);
    }
    if (rec.total > 0) drawRank(g, rec.rank, rec.total, sy);

    // 被弾したタイミング
    const duration = Math.max(1, n * rec.interval);
    g.strokeStyle = "#555"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(PAD, ty); g.lineTo(W - PAD, ty); g.stroke();
    g.save();
    g.strokeStyle = "#ff3b3b"; g.lineWidth = 5;
    g.shadowColor = "#ff3b3b"; g.shadowBlur = 12;
    for (const h of rec.hits) cross(g, PAD + (W - PAD * 2) * Math.min(1, h.t / duration), ty, 13);
    g.restore();
    g.fillStyle = "#8a8a8a"; g.font = font(24);
    g.fillText("0秒", PAD, ty + 54);
    g.textAlign = "right";
    g.fillText(`${Math.round(duration)}秒`, W - PAD, ty + 54);
    g.textAlign = "center";
    g.fillText("被弾したタイミング", W / 2, ty + 54);
    g.textAlign = "left";

    // クレジット（右下に小さく。秒数の行とは段を分ける）
    g.fillStyle = "#666"; g.font = font(20);
    g.textAlign = "right";
    g.fillText(CREDIT, W - PAD, cy);
    g.textAlign = "left";

    return canvas;
  }

  async function main() {
    const message = document.getElementById("message");
    let rec;
    try {
      rec = await CardCode.decode(location.hash.slice(1));
    } catch {
      message.textContent = "記録を読み込めませんでした。QR コードを読み直してください。";
      return;
    }

    const [portrait] = await Promise.all([loadPortrait(rec.difficulty), loadHeadingFont()]);
    const canvas = draw(rec, portrait);
    const img = document.getElementById("card");
    img.src = canvas.toDataURL("image/png");
    img.style.display = "block";

    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const name = `lidar-battle-${rec.time.getFullYear()}${pad2(rec.time.getMonth() + 1)}${pad2(rec.time.getDate())}-${pad2(rec.time.getHours())}${pad2(rec.time.getMinutes())}.png`;
    const file = new File([blob], name, { type: "image/png" });

    const save = document.getElementById("save");
    save.style.display = "block";
    save.onclick = async () => {
      // スマホは共有メニュー（「画像を保存」で写真に入る）、PC はダウンロード。
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch { /* キャンセル */ }
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    };
    message.remove(); // 読み込めたら「読み込み中…」は要らない

    const replay = document.getElementById("replay");
    const replayCanvas = replay.querySelector("canvas");
    replayCanvas.style.aspectRatio = `${rec.aspect} / 1.15`; // 下の文字の段のぶん少し縦に長く
    replay.style.display = "flex";
    ReplayPlayer.create(replayCanvas, { fontPx: () => 15 }).show(rec);
  }

  main();
</script>
</body>
</html>
