<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録カード</title>
<style>
  :root { --bg: #000; --fg: #fff; --dim: #8a8a8a; --accent: #ffe14d; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 16px 40px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .1em; }
  #wrap { position: relative; width: 100%; max-width: 540px; border: 2px solid #333; display: none; }
  #card { display: block; width: 100%; }
  /* 被弾回数の光を動かすキャンバス。カード画像の上に重ね、長押しは下の画像に通す */
  #glow { position: absolute; pointer-events: none; display: none; }
  button {
    width: 100%;
    max-width: 540px;
    padding: 16px;
    font: inherit;
    font-size: 18px;
    font-weight: bold;
    color: #000;
    background: var(--accent);
    border: 0;
    display: none;
  }
  p { margin: 0; color: var(--dim); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<h1>あなたの記録</h1>
<div id="wrap"><img id="card" alt="記録カード"><canvas id="glow"></canvas></div>
<button id="save">画像を保存</button>
<p id="message">読み込み中…</p>

<script src="cardcode.js"></script>
<script>
  const TITLE = "弾幕ゲーム in 工大祭2026";
  const CREDIT = "制作: ry0py ／ イラスト: ○○"; // ○○ はイラストの人の名前に差し替える
  const W = 1080, H = 1350, PAD = 60;
  const COLORS = { Easy: "#5be37d", Medium: "#ffb43b", Hard: "#ff5a5a" };
  const FONT = '"Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif';

  const pad2 = n => String(n).padStart(2, "0");
  const dateText = d => `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}  ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const font = (size, weight = "normal") => `${weight} ${size}px ${FONT}`;

  // 赤い ✕（被弾の印）。盤面と「被弾したタイミング」で共用する。
  function cross(g, x, y, r) {
    g.beginPath(); g.moveTo(x - r, y - r); g.lineTo(x + r, y + r); g.moveTo(x + r, y - r); g.lineTo(x - r, y + r); g.stroke();
  }

  // 被弾 0〜3 回は数字と「回」の文字そのものを光らせる。t [秒] で動く（保存する画像は t = 0 の姿）。
  // 返すのは文字の塗り・光の色・光の広がり。x0〜x1 は文字の左右端。
  const pulse = t => 22 + 14 * (0.5 + 0.5 * Math.sin(t * 4));
  const rainbow = (g, x0, x1, t) => {
    const hue = k => (k * 60 + t * 120) % 360;
    const grad = g.createLinearGradient(x0, 0, x1, 0);
    for (let k = 0; k <= 6; k++) grad.addColorStop(k / 6, `hsl(${hue(k)}, 100%, 62%)`);
    return { fill: grad, shadow: `hsl(${hue(1)}, 100%, 60%)`, blur: pulse(t) };
  };
  // 金・銀・銅: 明るい帯が文字の上を左右に行き来する。
  const metal = (base, light, shadow) => (g, x0, x1, t) => {
    const cx = x0 + (x1 - x0) * (0.5 + 0.5 * Math.sin(t * 2.5));
    const grad = g.createLinearGradient(cx - 90, 0, cx + 90, 0);
    grad.addColorStop(0, base); grad.addColorStop(0.5, light); grad.addColorStop(1, base);
    return { fill: grad, shadow, blur: pulse(t) };
  };
  const GLOWS = [
    rainbow,
    metal("#e0a81e", "#fff6c8", "#ffc93c"),
    metal("#a9a9a9", "#ffffff", "#e6e6e6"),
    metal("#b8743c", "#ffd2a8", "#e08a4a"),
  ];

  function layout(rec) {
    const bw = W - PAD * 2, bh = bw / rec.aspect, bx = PAD, by = 260;
    const sy = by + bh + 230; // 被弾回数の数字のベースライン − 50
    // 被弾回数のまわり。表示中はこの範囲だけ #glow に描き直す（右の「ノーミス！」と上下の文字にかからない）
    const area = { x: 0, y: sy - 148, w: 560, h: 238 };
    return { bx, by, bw, bh, sy, area };
  }

  function drawCount(g, hits, sy, t) {
    g.fillStyle = "#fff";
    g.font = font(44);
    g.fillText("被弾", PAD, sy - 100);

    const count = String(hits);
    g.font = font(150, "bold");
    const cw = g.measureText(count).width;
    g.font = font(56);
    const ux = PAD + cw + 28;
    const x1 = ux + g.measureText("回").width;

    g.save();
    const glow = GLOWS[hits]?.(g, PAD, x1, t);
    if (glow) { g.fillStyle = glow.fill; g.shadowColor = glow.shadow; g.shadowBlur = glow.blur; }
    g.font = font(150, "bold");
    g.fillText(count, PAD, sy + 50);
    g.font = font(56);
    g.fillText("回", ux, sy + 50);
    g.restore();
  }

  function draw(rec) {
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext("2d");

    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);

    // 見出し
    g.fillStyle = "#8a8a8a";
    g.font = font(34);
    g.fillText(TITLE, PAD, 100);
    g.fillStyle = COLORS[rec.difficulty] ?? "#fff";
    g.font = font(96, "bold");
    g.fillText(rec.difficulty.toUpperCase(), PAD, 210);
    g.fillStyle = "#fff";
    g.font = font(40);
    g.textAlign = "right";
    g.fillText(dateText(rec.time), W - PAD, 205);
    g.textAlign = "left";

    // 盤面と軌跡（座標は 0〜1、y は上向き）
    const { bx, by, bw, bh, sy } = layout(rec);
    const px = x => bx + x * bw, py = y => by + (1 - y) * bh;

    g.strokeStyle = "#1c1c1c";
    g.lineWidth = 2;
    for (let i = 1; i < 8; i++) {
      g.beginPath(); g.moveTo(bx + bw * i / 8, by); g.lineTo(bx + bw * i / 8, by + bh); g.stroke();
      g.beginPath(); g.moveTo(bx, by + bh * i / 8); g.lineTo(bx + bw, by + bh * i / 8); g.stroke();
    }

    g.lineWidth = 5;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.strokeStyle = "#4dc3ff";
    const n = rec.path.length;
    g.beginPath();
    rec.path.forEach(([x, y], i) => i === 0 ? g.moveTo(px(x), py(y)) : g.lineTo(px(x), py(y)));
    g.stroke();
    if (n > 0) {
      g.strokeStyle = "#fff"; g.lineWidth = 4;
      g.beginPath(); g.arc(px(rec.path[0][0]), py(rec.path[0][1]), 14, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#fff";
      g.beginPath(); g.arc(px(rec.path[n - 1][0]), py(rec.path[n - 1][1]), 12, 0, Math.PI * 2); g.fill();
    }

    g.save();
    g.strokeStyle = "#ff3b3b"; g.lineWidth = 5;
    g.shadowColor = "#ff3b3b"; g.shadowBlur = 16;
    for (const h of rec.hits) cross(g, px(h.x), py(h.y), 13);
    g.restore();

    g.strokeStyle = "#fff"; g.lineWidth = 6;
    g.strokeRect(bx, by, bw, bh);

    g.font = font(26);
    g.fillStyle = "#8a8a8a";
    g.fillText("○ スタート   ● ゴール   ✕ 被弾", bx, by + bh + 44);

    // 被弾回数
    drawCount(g, rec.hits.length, sy, 0);
    if (rec.hits.length === 0) {
      g.fillStyle = "#ffe14d";
      g.font = font(72, "bold");
      g.textAlign = "right";
      g.fillText("ノーミス！", W - PAD, sy + 40);
      g.textAlign = "left";
    }

    // 被弾したタイミング
    const duration = Math.max(1, n * rec.interval);
    const ty = sy + 150;
    g.strokeStyle = "#555"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(PAD, ty); g.lineTo(W - PAD, ty); g.stroke();
    g.save();
    g.strokeStyle = "#ff3b3b"; g.lineWidth = 5;
    g.shadowColor = "#ff3b3b"; g.shadowBlur = 12;
    for (const h of rec.hits) cross(g, PAD + (W - PAD * 2) * Math.min(1, h.t / duration), ty, 13);
    g.restore();
    g.fillStyle = "#8a8a8a"; g.font = font(24);
    g.fillText("0秒", PAD, ty + 54);
    g.textAlign = "right";
    g.fillText(`${Math.round(duration)}秒`, W - PAD, ty + 54);
    g.textAlign = "left";
    g.fillText("被弾したタイミング", PAD + 90, ty + 54);

    // クレジット（右下に小さく）
    g.fillStyle = "#666"; g.font = font(20);
    g.textAlign = "right";
    g.fillText(CREDIT, W - PAD, H - 40);
    g.textAlign = "left";

    return canvas;
  }

  // 被弾 0〜3 回なら、カード画像の上の #glow に被弾回数だけを毎フレーム描き直して光を動かす。
  function animateCount(rec) {
    const hits = rec.hits.length;
    if (!GLOWS[hits]) return;
    const { sy, area: a } = layout(rec);
    const c = document.getElementById("glow");
    c.width = a.w; c.height = a.h;
    Object.assign(c.style, { left: `${a.x / W * 100}%`, top: `${a.y / H * 100}%`, width: `${a.w / W * 100}%`, display: "block" });
    const g = c.getContext("2d");
    const frame = now => {
      g.fillStyle = "#000";
      g.fillRect(0, 0, a.w, a.h);
      g.save();
      g.translate(-a.x, -a.y);
      drawCount(g, hits, sy, now / 1000);
      g.restore();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  async function main() {
    const message = document.getElementById("message");
    let rec;
    try {
      rec = await CardCode.decode(location.hash.slice(1));
    } catch {
      message.textContent = "記録を読み込めませんでした。QR コードを読み直してください。";
      return;
    }

    const canvas = draw(rec);
    const img = document.getElementById("card");
    img.src = canvas.toDataURL("image/png");
    document.getElementById("wrap").style.display = "block";
    animateCount(rec);

    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const name = `lidar-battle-${rec.time.getFullYear()}${pad2(rec.time.getMonth() + 1)}${pad2(rec.time.getDate())}-${pad2(rec.time.getHours())}${pad2(rec.time.getMinutes())}.png`;
    const file = new File([blob], name, { type: "image/png" });

    const save = document.getElementById("save");
    save.style.display = "block";
    save.onclick = async () => {
      // スマホは共有メニュー（「画像を保存」で写真に入る）、PC はダウンロード。
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch { /* キャンセル */ }
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    };
    message.textContent = "画像を長押ししても保存できます";
  }

  main();
</script>
</body>
</html>
