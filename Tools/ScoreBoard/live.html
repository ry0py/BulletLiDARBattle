<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiDAR の視界</title>
<style>
  /* 別の PC で http://<展示 PC の IP>:8000/live を開いて出す。会場はネットが無い前提なので外部のものは使わない */
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8a8a;
    --line: #fff;
    --new: #ffe14d;
    --easy: #5be37d;
    --medium: #ffb43b;
    --hard: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "BIZ UDGothic", "MS Gothic", "Yu Gothic UI", monospace;
    display: flex;
    flex-direction: column;
    padding: 2.5vh 3vw;
    gap: 1.5vh;
    overflow: hidden;
  }
  header { display: flex; align-items: baseline; gap: 1.2em; }
  h1 { margin: 0; font-size: 5vh; letter-spacing: .15em; }
  .info { font-size: 3.4vh; display: flex; align-items: baseline; gap: .8em; }
  .info .difficulty { font-size: 4.4vh; font-weight: bold; letter-spacing: .1em; }
  .info b { font-size: 4.4vh; }
  #status { margin-left: auto; font-size: 1.8vh; color: var(--hard); }
  canvas { flex: 1; min-height: 0; width: 100%; border: 4px solid var(--line); }
  .legend { margin: 0; font-size: 2vh; color: var(--dim); }
  .legend span { margin-right: 2em; }
</style>
</head>
<body>
<header>
  <h1>LiDAR の視界</h1>
  <div class="info"></div>
  <span id="status"></span>
</header>
<canvas></canvas>
<p class="legend"><span style="color: #4dc3ff">● LiDAR が見ている点</span><span style="color: var(--new)">◯ 見つけたハート</span><span style="color: var(--fg)">● SOUL</span><span style="color: #ff5aa0">■ LiDAR</span></p>

<script>
  // Unity の Flow/LiveFeed がバトル中だけ書く live.json を出す。座標は盤面の正規化座標 × 1000。
  const LIVE_POLL_MS = 100;
  const VIEW_MARGIN = 0.3; // Unity が点を送ってくる範囲（盤面の外側にこれだけ）
  const COLORS = { Easy: "var(--easy)", Medium: "var(--medium)", Hard: "var(--hard)" };
  const canvas = document.querySelector("canvas");

  // canvas の描画サイズを表示サイズに合わせ、[2D コンテキスト, 幅, 高さ, 1 CSS px の実ピクセル数] を返す。
  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    return [canvas.getContext("2d"), w, h, dpr];
  }

  function message(g, w, h, dpr, text) {
    g.fillStyle = "#8a8a8a"; g.font = `${3 * innerHeight / 100 * dpr}px "BIZ UDGothic", "MS Gothic", monospace`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, w / 2, h / 2);
  }

  function drawIdle() {
    document.querySelector(".info").innerHTML = "";
    const [g, w, h, dpr] = fitCanvas();
    g.clearRect(0, 0, w, h);
    message(g, w, h, dpr, "バトルが始まると LiDAR の点群が出ます");
  }

  function drawLive(d) {
    document.querySelector(".info").innerHTML =
      `<span class="difficulty" style="color: ${COLORS[d.difficulty]}">${d.difficulty.toUpperCase()}</span>`
      + `<span>プレイ中</span><span>残り <b>${d.remaining}</b> 秒</span>`;

    const [g, w, h, dpr] = fitCanvas();
    g.clearRect(0, 0, w, h);
    const aspect = d.aspect / 1000;
    const pt = ([x, y]) => [x / 1000, y / 1000];
    const sensor = d.sensor && pt(d.sensor);

    // 見せる範囲: 盤面の周りと LiDAR の位置。横は物理の長さの比（aspect）で伸ばす
    let u0 = -VIEW_MARGIN, u1 = 1 + VIEW_MARGIN, v0 = -VIEW_MARGIN, v1 = 1 + VIEW_MARGIN;
    if (sensor) {
      u0 = Math.min(u0, sensor[0] - 0.05); u1 = Math.max(u1, sensor[0] + 0.05);
      v0 = Math.min(v0, sensor[1] - 0.05); v1 = Math.max(v1, sensor[1] + 0.05);
    }
    const scale = Math.min(w / ((u1 - u0) * aspect), h / (v1 - v0));
    const ox = (w - (u1 - u0) * aspect * scale) / 2, oy = (h - (v1 - v0) * scale) / 2;
    const X = u => ox + (u - u0) * aspect * scale, Y = v => oy + (v1 - v) * scale;

    // 盤面（方眼と枠）
    g.strokeStyle = "#1c1c1c"; g.lineWidth = dpr;
    for (let i = 1; i < 8; i++) {
      g.beginPath(); g.moveTo(X(i / 8), Y(0)); g.lineTo(X(i / 8), Y(1)); g.stroke();
      g.beginPath(); g.moveTo(X(0), Y(i / 8)); g.lineTo(X(1), Y(i / 8)); g.stroke();
    }
    g.strokeStyle = "#fff"; g.lineWidth = 3 * dpr;
    g.strokeRect(X(0), Y(1), X(1) - X(0), Y(0) - Y(1));

    if (d.lidar) {
      const pts = d.points;
      // LiDAR から点へのレーザー（うすく）と点
      g.strokeStyle = "rgba(77, 195, 255, .08)"; g.lineWidth = dpr;
      g.beginPath();
      for (let i = 0; i < pts.length; i += 2) { g.moveTo(X(sensor[0]), Y(sensor[1])); g.lineTo(X(pts[i] / 1000), Y(pts[i + 1] / 1000)); }
      g.stroke();
      g.fillStyle = "#4dc3ff";
      const s = 4 * dpr;
      for (let i = 0; i < pts.length; i += 2) g.fillRect(X(pts[i] / 1000) - s / 2, Y(pts[i + 1] / 1000) - s / 2, s, s);

      g.fillStyle = "#ff5aa0";
      g.fillRect(X(sensor[0]) - 8 * dpr, Y(sensor[1]) - 8 * dpr, 16 * dpr, 16 * dpr);

      if (d.heart) {
        const [u, v] = pt(d.heart);
        g.strokeStyle = "#ffe14d"; g.lineWidth = 3 * dpr;
        g.beginPath(); g.arc(X(u), Y(v), 22 * dpr, 0, Math.PI * 2); g.stroke();
      }
    } else {
      message(g, w, h, dpr, "LiDAR につながっていません");
    }

    const [su, sv] = pt(d.soul);
    g.fillStyle = "#fff";
    g.beginPath(); g.arc(X(su), Y(sv), 9 * dpr, 0, Math.PI * 2); g.fill();
  }

  async function pollLive() {
    try {
      const res = await fetch("live.json", { cache: "no-store" });
      if (res.ok) { // 503 は Unity が書き換え中なので今の表示のまま
        const d = await res.json();
        if (d.state === "playing") drawLive(d);
        else drawIdle();
      }
      document.getElementById("status").textContent = "";
    } catch {
      document.getElementById("status").textContent = "サーバーにつながりません";
    }
    setTimeout(pollLive, LIVE_POLL_MS);
  }

  drawIdle();
  pollLive();
</script>
</body>
</html>
